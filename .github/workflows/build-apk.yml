name: Build APK

on:
  push:
    branches:
      - claude/animated-fractals-android-tonykp
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-fractuals-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest debug APK
          body: Auto-built from commit ${{ github.sha }}. Download app-debug.apk below and install on your Android phone.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
